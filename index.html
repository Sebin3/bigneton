<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Big Data — Analítica de datos empresariales: perfila millones de registros, mide su calidad y visualiza decisiones en un solo panel." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Big Data · Analítica de datos para tu negocio</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Preview al compartir el link (WhatsApp, Discord, X, LinkedIn...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Big Data" />
    <meta property="og:title" content="Big Data · Analítica de datos para tu negocio" />
    <meta
      property="og:description"
      content="Perfil millones de registros, mide su calidad y visualiza decisiones en un solo panel."
    />
    <meta property="og:image" content="/og-banner.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Big Data · Analítica de datos para tu negocio" />
    <meta
      name="twitter:description"
      content="Perfil millones de registros, mide su calidad y visualiza decisiones en un solo panel."
    />
    <meta name="twitter:image" content="/og-banner.png" />
    <script>
      ;(() => {
        try {
          const saved = localStorage.getItem('ds_theme')
          const dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
